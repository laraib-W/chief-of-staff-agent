# Copy this file to `config.yaml` and fill in real values.
# `config.yaml` is gitignored — it contains identity data (delivery
# address, allowlists, project IDs) that should not land in a public repo.
#
# Every key is documented in specs.md §6.3.

identity:
  user_name: "Jane Doe"
  timezone: "Asia/Karachi"               # IANA zone name
  delivery_address: "jane@example.com"
  run_time: "08:00"                      # local time; OS scheduler invokes app.run

gmail:
  allowlist:
    - "ceo@client.com"
  trusted_domains:
    - "arbisoft.com"
  fetch_window_hours: 24
  max_body_chars: 2000                   # body length cap (SECURITY.md §3)

plane:
  base_url: "https://api.plane.so"       # or self-hosted URL
  workspace_slug: "my-workspace"         # the slug in your Plane URL: app.plane.so/<slug>/
  project_ids:
    - "proj-abc-123"
  ignore_list: []
  rolling_window_days: 7
  # Optional: remap state names to a different Plane state group when the
  # workspace admin has miscategorized states. Values must be one of
  # backlog / unstarted / started / completed / cancelled. States not
  # listed keep whatever group Plane returns. Run `python -m app.auth
  # --list-states` to see the current classification for every state.
  state_group_overrides: {}
  # state_group_overrides:
  #   "Ready for test": started
  #   "Ready": unstarted
  #   "Needs Info": started

thresholds:
  inactivity_days: 4
  overdue_grace_days: 0
  load_multiplier: 1.5
  due_soon_horizon_days: 7

llm:
  # provider selects the backend SDK. Set the matching API key in .env
  # (ANTHROPIC_API_KEY for anthropic, GEMINI_API_KEY for gemini).
  provider: "anthropic"                  # one of: anthropic, gemini
  # model must be valid for the chosen provider, e.g.:
  #   anthropic: claude-sonnet-4-6, claude-opus-4-7, claude-haiku-4-5
  #   gemini:    gemini-2.5-flash, gemini-2.5-pro
  model: "claude-sonnet-4-6"
  max_tokens_per_node: 4096
  batch_mode: true                       # false = per-item calls
