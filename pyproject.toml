[project]
name = "chief-of-staff-agent"
version = "0.1.0"
description = "Morning Chief-of-Staff Agent — a single-user, read-only agent that delivers a daily prioritized digest by email."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Arbisoft" }]

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "keyring>=25.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
cos-agent = "app.run:main"
cos-auth = "app.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "PT"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PT011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "unit: fast, no external dependencies",
    "integration: full-pipeline tests with mocked APIs",
    "replay: run against recorded fixtures",
    "evaluation: quality evaluation against golden sets",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
